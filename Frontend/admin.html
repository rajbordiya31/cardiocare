<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardioCare Admin Portal – Dr. Narendra Bordiya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#1e3270',
                        },
                    },
                }
            }
        }
    </script>

    <!-- Reuse the main styles -->
    <link rel="stylesheet" href="styles.css" />

    <style>
        .admin-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 20px -2px rgba(30, 58, 138, 0.08);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .admin-card:hover {
            box-shadow: 0 12px 40px -8px rgba(30, 58, 138, 0.12);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.75rem;
        }

        th {
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem;
            text-align: left;
        }

        td {
            background: white;
            padding: 1.25rem 1rem;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        td:first-child {
            border-left: 1px solid #f1f5f9;
            border-top-left-radius: 1rem;
            border-bottom-left-radius: 1rem;
        }

        td:last-child {
            border-right: 1px solid #f1f5f9;
            border-top-right-radius: 1rem;
            border-bottom-right-radius: 1rem;
        }
    </style>
</head>

<body class="font-sans bg-slate-50 text-slate-800 antialiased">

    <!-- Root for React -->
    <div id="root"></div>

    <!-- React 18 + Babel (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Admin entry -->
    <script type="text/babel" src="admin.jsx"></script>
</body>

</html>
